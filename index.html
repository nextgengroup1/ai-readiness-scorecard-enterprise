<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI Modernization Readiness Scorecard — Enterprise</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F0F2F5;color:#111827;line-height:1.6}
   
    /* NAV */
    nav{background:#0B1120;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .nav-logo{color:#fff;font-weight:700;font-size:15px;letter-spacing:.3px}
    .nav-logo span{color:#3B82F6}
    .nav-cta{background:#3B82F6;color:#fff;text-decoration:none;padding:9px 20px;border-radius:6px;font-size:13px;font-weight:600;transition:background .2s}
    .nav-cta:hover{background:#2563EB}
   
    /* HERO */
    .hero{background:linear-gradient(135deg,#0B1120 0%,#1E3A5F 100%);color:#fff;padding:80px 24px 72px;text-align:center}
    .hero-badge{display:inline-block;background:rgba(59,130,246,.18);border:1px solid rgba(59,130,246,.45);color:#93C5FD;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px;border-radius:20px;margin-bottom:28px}
    .hero h1{font-size:clamp(30px,5vw,54px);font-weight:800;line-height:1.1;letter-spacing:-.02em;max-width:780px;margin:0 auto 22px}
    .hero h1 em{font-style:normal;color:#60A5FA}
    .hero-sub{font-size:clamp(15px,2vw,18px);color:#94A3B8;max-width:580px;margin:0 auto 40px;line-height:1.7}
    .hero-actions{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
    
    /* RECONSTRUCTED HERO BUTTONS & STYLING */
    .btn-primary{display:inline-flex;align-items:center;gap:8px;background:#3B82F6;color:#fff;text-decoration:none;padding:16px 36px;border-radius:8px;font-size:16px;font-weight:600;transition:background .2s}
    .btn-primary:hover{background:#2563EB}
  </style>

  <!-- GUMROAD OVERLAY EMBED SCRIPT -->
  <script src="https://gumroad.com"></script>
</head>
<body>

  <!-- NAVIGATION BAR -->
  <nav>
    <div class="nav-logo">Enterprise<span>.AI</span></div>
    <!-- Navigation Overlay Button -->
    <a href="https://nextgengroup1.gumroad.com/l/ai-modernization-scorecard-enterprise" class="gumroad-button nav-cta">
      Get Scorecard
    </a>
  </nav>

  <!-- HERO SECTION -->
  <header class="hero">
    <div class="hero-badge">Enterprise Edition</div>
    <h1>AI Modernization <em>Readiness Scorecard</em></h1>
    <p class="hero-sub">Evaluate, grade, and optimize your business infrastructure for high-performance AI deployment.</p>
    <div class="hero-actions">
      <!-- Main Hero Overlay Button -->
      <a href="https://nextgengroup1.gumroad.com/l/ai-modernization-scorecard-enterprise" class="gumroad-button btn-primary">
        Get Scorecard Now
      </a>
    </div>
  </header>

</body>
</html>
